# Pinned baseline from DECISION-bridge.md and the AAR's integration guide:
# compile SDK 36, Kotlin 1.9.25, Gradle 8.13, AGP 8.13.0, Java 17.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The AAR is fetched by ../fetch-aar.sh and is never committed, so it lives in a gitignored
# directory. Overridable so CI can point at its own verified copy.
bande.foundryAarDir=../libs

# Which deployment mode the facade is compiled against: ipc (the default) or embedded.
# Both AARs publish the identical Kotlin API, so this selects a compile-only input; the app
# must reference the same one. Set with -Pbande.foundryAarMode=embedded for the embedded build.
bande.foundryAarMode=ipc
