name: Build and pack

# Usage policy: `build` on ubuntu-latest is the required gate and runs on every pull
# request and every push to `main` or `dev`. The multi-platform jobs (`host-smoke`,
# `sandbox-advisory`) are advisory and run only on the nightly schedule, because a platform
# gap is a property of the runner and not of the change under review. See
# docs/SANDBOX_CI.md and docs/DESIGN.md section 6.
on:
  push:
    # `dev` is kept: squash-merging a pull request creates a commit that was never built,
    # and RELEASING.md requires a green run on `dev` before a tag. The platform jobs are
    # skipped here too (see the job guard below), so a dev push costs one job, not six.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # Documentation, squad state and example-only changes cannot move the durable
    # layer or the hosts, so they do not earn a full cross-language build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.squad/**'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Nightly, so platform drift is caught within a day instead of waiting for the
    # next pull request that happens to touch a sandbox or host path.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same pull request. A push that is replaced by a
# later push in the same branch never needs to finish: only the newest commit is a
# candidate for merge. Scheduled and main-push runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- advisory jobs
  # The only multi-platform work in this workflow, and nightly-only: both jobs are skipped
  # except on `schedule`. A platform gap is a property of the runner, so one run per runner
  # per day carries the same information as one run per commit. To check a specific pull
  # request against Windows or macOS, run the job locally on that platform.
  host-smoke:
    name: Host smoke (${{ matrix.os }})
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build runtime host
        run: dotnet build src/Durable.Runtime -c Release --nologo
      - name: Smoke CLI, HTTP, RPC and portability contracts
        run: dotnet test tests/Durable.Tests -c Release --nologo --filter "FullyQualifiedName~RuntimeHost|FullyQualifiedName~JsonlBackend" --logger "trx;LogFileName=host-smoke.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-smoke-${{ matrix.os }}
          path: tests/Durable.Tests/TestResults/host-smoke.trx
          if-no-files-found: error

  # Advisory: prints the platform, the backend the runtime reports, and each sandbox
  # example's `run mode:` line on every runner. CI has no Copilot sign-in, so the examples
  # run against the recorded runtime and every line reads `Replayed`: that proves policy
  # propagation, not OS enforcement — see docs/SANDBOX_CI.md.
  #
  # `continue-on-error` is on the reporting step, not the job. A platform gap is a property
  # of the machine, never of the change under review, so it must not fail a pull request;
  # but a script that produces no report is a defect, and job-level continue-on-error would
  # rewrite even that to a green check. Splitting the two keeps the gap tolerated and the
  # defect visible. This job is not in any `needs:` chain and is not required.
  #
  # It runs on the nightly schedule rather than on pull requests: the report describes the
  # runners, so one run per platform per day carries the same information as one run per
  # commit, without spending a runner-minute on every push.
  sandbox-advisory:
    name: Sandbox advisory (${{ matrix.os }})
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # A backend difference is a property of the machine, never of the change under
      # review, so this step alone tolerates a non-zero exit.
      - name: Report detected backend and platform per sandbox example
        continue-on-error: true
        shell: bash
        run: ./scripts/sandbox-advisory.sh | tee sandbox-advisory.log
      # A missing report is a script defect, not a platform gap, so this one is not tolerated.
      - name: Assert the report completed
        if: always()
        shell: bash
        run: |
          if ! grep -q '^advisory-report: complete$' sandbox-advisory.log; then
            echo "::error::the advisory report did not reach its summary; see the step log above"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # NuGet package cache. The repository has no packages.lock.json, so the
          # project files are the dependency key: a package reference change is what
          # actually invalidates the restore.
          cache: true
          cache-dependency-path: |
            lib/*.csproj
            src/**/*.csproj
            tests/**/*.csproj

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: lib/py/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Two independent node_modules trees; one cache covers both by keying on
          # each lockfile.
          cache: 'npm'
          cache-dependency-path: |
            lib/ts/package-lock.json
            examples/ts/package-lock.json

      - name: Install cross-language test dependencies
        run: |
          python3 -m pip install -e lib/py
          npm ci --prefix lib/ts
          npm ci --prefix examples/ts

      - name: Restore
        run: dotnet restore lib/Copilot.Durable.csproj

      - name: Build
        run: dotnet build lib/Copilot.Durable.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/Durable.Tests --nologo -v q

      # Compiles all 38 examples and runs the 17 that need no Copilot sign-in. This is the
      # plain path: it does not compare an example against itself, so it cannot catch an
      # example whose output changes from run to run.
      # SKIP_TESTS=1 because the Test step above already ran the xUnit suite;
      # without it validate.sh would run the same tests a second time.
      - name: Validate examples
        run: SKIP_LIVE=1 SKIP_TESTS=1 ./scripts/validate.sh

      # The deterministic pass (docs/DESIGN.md section 6.1): every example that needs no
      # Copilot sign-in runs against the recorded runtime, asserts the effective model the
      # recording names, and is then run a second time with its normalised output compared
      # against the first. It is a separate step rather than a matrix leg so that a
      # non-deterministic example fails one named step next to the plain pass it complements,
      # and so the dotnet restore/build/test cache the step above populated is reused.
      # The step above stays because it covers the live-gated examples this pass excludes.
      # SKIP_TESTS is deliberately NOT set here: this step runs the suites the plain path
      # never runs (ReplayRuntime.Tests, ReplayToolDispatchTests, the Python and TypeScript
      # parity suites, and both language unit suites). Those are part of this step's value,
      # so skipping them would leave the gate green while a parity regression shipped.
      - name: Validate examples (deterministic)
        run: ./scripts/validate.sh --deterministic

      - name: Pack
        run: dotnet pack lib/Copilot.Durable.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
