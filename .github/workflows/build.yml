name: Build and pack

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore lib/Copilot.Durable.csproj

      - name: Build
        run: dotnet build lib/Copilot.Durable.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/Durable.Tests --nologo -v q

      - name: Compile examples
        run: COMPILE_ONLY=1 SKIP_TESTS=1 ./scripts/validate.sh

      - name: Pack
        run: dotnet pack lib/Copilot.Durable.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
