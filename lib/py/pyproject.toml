[project]
name = "copilot-durable"
version = "0.1.0"
description = "The durable layer of the Copilot SDK, ported to Python."
requires-python = ">=3.11"
dependencies = ["github-copilot-sdk==1.0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["durable"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["durable.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
